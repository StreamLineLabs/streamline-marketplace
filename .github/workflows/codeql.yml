name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

# Uploading results requires code scanning to be enabled for the repository.
# Set the repository Actions variable CODEQL_ENABLED=true only after enabling
# code scanning / GitHub Advanced Security as applicable. Until then this job
# intentionally reports a neutral skip.
#
# Keep forked contributions on the unprivileged pull_request event; never use
# pull_request_target for a workflow that analyzes pull-request source.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
